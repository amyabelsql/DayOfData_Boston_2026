name: SQL lint

on:
  pull_request:
    paths:
      - "database/**/*.sql"
      - ".sqlfluff"
      - ".github/workflows/sql-lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SQLFluff
        run: python -m pip install sqlfluff==4.3.0
      - name: Lint T-SQL
        run: sqlfluff lint database/
