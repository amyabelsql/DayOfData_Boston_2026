name: Maintenance or job failure
description: Report a failed database job or maintenance task
title: "[Maintenance] "
labels:
  - maintenance
  - needs-dba-review
body:
  - type: input
    id: job
    attributes:
      label: Job or task name
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Failure time and time zone
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Dev
        - Test
        - Prod
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error and relevant log lines
      description: Remove secrets and private data.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and steps already taken
    validations:
      required: true
